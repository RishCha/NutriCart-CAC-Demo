<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Reset Password · NutriCart</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css', v='simplified-ui-18') }}">
</head>
<body>
  <main class="shell password-reset-page">
    <a class="brand" href="/" aria-label="NutriCart home"><span class="brand-mark" aria-hidden="true">{% include "nutricart-logo.svg" %}</span><strong>NutriCart</strong></a>
    <section class="panel" aria-labelledby="reset-title">
      <h1 id="reset-title">Reset Password</h1>
      <form id="reset-password-form" class="account-form">
        <label>New Password<span class="password-field"><input id="reset-new-password" type="password" autocomplete="new-password" minlength="10" maxlength="512" aria-describedby="reset-password-help reset-strength" required><button class="password-toggle" type="button" aria-label="Show new password">Show</button></span><small id="reset-password-help" class="field-help">Use at least 10 characters.</small><span id="reset-strength" class="password-strength" data-password-strength="reset-new-password" aria-label="Password strength" role="status" aria-live="polite"></span></label>
        <label>Confirm New Password<span class="password-field"><input id="reset-confirm-password" type="password" autocomplete="new-password" minlength="10" maxlength="512" data-confirm-password="reset-new-password" required><button class="password-toggle" type="button" aria-label="Show confirmed password">Show</button></span></label>
        <button class="primary" type="submit">Reset Password</button>
      </form>
      <p id="reset-password-status" class="status" role="status" aria-live="polite"></p>
      <a id="reset-sign-in" href="/?signin=1">Return to Sign In</a>
    </section>
  </main>
  <script src="{{ url_for('static', filename='password_fields.js', v='account-recovery-1') }}" defer></script>
  <script src="{{ url_for('static', filename='reset_password.js', v='account-recovery-1') }}" defer></script>
</body>
</html>
